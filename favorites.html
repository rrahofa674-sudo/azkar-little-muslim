  </button></div><script>


/* ==================================================
   قراءة المفضلة
================================================== */

function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "favoriteAzkar"
      )
    ) || [];

  } catch (error) {

    return [];

  }

}


/* ==================================================
   عرض المفضلة
================================================== */

function showFavorites() {

  const favorites =
    getFavorites();

  const container =
    document.getElementById(
      "favoritesList"
    );

  const countElement =
    document.getElementById(
      "favoriteCount"
    );


  container.innerHTML = "";


  /* تحديث العدد */

  countElement.textContent =
    "❤️ عدد الأذكار: " +
    favorites.length;


  /* لا توجد مفضلة */

  if (
    favorites.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <span class="empty-icon">
          ❤️
        </span>

        لا توجد أذكار في المفضلة بعد

        <br>

        أضيفي أذكارك المفضلة
        لتجديها هنا 🌷

        <br>

        <small>
          يمكنك الضغط على ❤️ بجانب أي ذكر
        </small>

      </div>

    `;

    return;

  }


  /* عرض الأذكار */

  favorites.forEach(
    (zekr, index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "favorite";


      card.innerHTML = `

        <div class="favorite-number">
          ${index + 1}
        </div>


        <div class="zekr-text">
          ${escapeHTML(zekr)}
        </div>


        <div class="controls">

          <button
            class="listen"
            id="listen-${index}"
            onclick="speakFavorite(${index})"
          >

            🔊 استمع

          </button>


          <button
            class="delete"
            onclick="removeFavorite(${index})"
          >

            🗑️ إزالة

          </button>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   حماية النص
================================================== */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==================================================
   🔊 قراءة الذكر
================================================== */

let speakingIndex = null;


function speakFavorite(index) {

  const favorites =
    getFavorites();


  if (
    !favorites[index]
  ) {

    return;

  }


  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "عذرًا، جهازك لا يدعم تشغيل الصوت."
    );

    return;

  }


  /* منع الضغط أثناء القراءة */

  if (
    speakingIndex === index
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  speakingIndex =
    index;


  const button =
    document.getElementById(
      "listen-" + index
    );


  button.textContent =
    "🔊 جاري القراءة...";


  button.disabled =
    true;


  const utterance =
    new SpeechSynthesisUtterance(
      favorites[index]
    );


  utterance.lang =
    "ar-SA";

  utterance.rate =
    0.75;

  utterance.pitch =
    1.05;

  utterance.volume =
    1;


  utterance.onend =
    function() {

      speakingIndex =
        null;

      button.textContent =
        "🔊 استمع";

      button.disabled =
        false;

    };


  utterance.onerror =
    function() {

      speakingIndex =
        null;

      button.textContent =
        "🔊 استمع";

      button.disabled =
        false;

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   🗑️ حذف ذكر
================================================== */

function removeFavorite(index) {

  const favorites =
    getFavorites();


  if (
    !favorites[index]
  ) {

    return;

  }


  const confirmed =
    confirm(
      "هل تريد إزالة هذا الذكر من المفضلة؟ ❤️"
    );


  if (!confirmed) {

    return;

  }


  /* إيقاف الصوت إذا كان يعمل */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  speakingIndex =
    null;


  favorites.splice(
    index,
    1
  );


  localStorage.setItem(
    "favoriteAzkar",
    JSON.stringify(
      favorites
    )
  );


  showFavorites();

}


/* ==================================================
   🏠 العودة للرئيسية
================================================== */

function goHome() {

  window.location.href =
    "index.html";

}


/* ==================================================
   تشغيل الصفحة
================================================== */

showFavorites();


</script></body></html>
