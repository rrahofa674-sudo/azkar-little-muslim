<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أذكاري المفضلة ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff8e7, #e8f8f0);
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #5b8068;
      margin-bottom: 25px;
    }

    .favorite {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      line-height: 1.9;
      font-size: 18px;
    }

    .delete {
      margin-top: 12px;
      border: none;
      background: #f6a6a6;
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .back {
      display: block;
      margin: 25px auto 0;
      border: none;
      background: #6f9b7c;
      color: white;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 20px;
      line-height: 2;
    }
  </style>
</head>

<body>

  <h1>❤️ أذكاري المفضلة</h1>

  <div id="favoritesList"></div>

  <button class="back" onclick="history.back()">
    🏠 العودة
  </button>

  <script>

    function showFavorites() {

      let favorites =
        JSON.parse(localStorage.getItem("favoriteAzkar")) || [];

      let container =
        document.getElementById("favoritesList");

      container.innerHTML = "";

      if (favorites.length === 0) {

        container.innerHTML = `
          <div class="empty">
            ❤️ لا توجد أذكار في المفضلة بعد
            <br>
            أضيفي أذكارك المفضلة لتجديها هنا 🌷
          </div>
        `;

        return;
      }

      favorites.forEach((zekr, index) => {

        let card = document.createElement("div");

        card.className = "favorite";

        card.innerHTML = `
          <div>${zekr}</div>

          <button class="delete"
            onclick="removeFavorite(${index})">
            🗑️ إزالة من المفضلة
          </button>
        `;

        container.appendChild(card);

      });

    }


    function removeFavorite(index) {

  let favorites =
    JSON.parse(localStorage.getItem("favoriteAzkar")) || [];

  favorites.splice(index, 1);

  localStorage.setItem(
    "favoriteAzkar",
    JSON.stringify(favorites)
  );

  showFavorites();

}


    showFavorites();

  </script>

</body>
</html>
