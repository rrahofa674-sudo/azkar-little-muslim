🏠 العودة للرئيسية

  </button></div><script>


/* ==================================================
   🍎 أذكار الطعام
   الأذكار والأعداد محفوظة كما هي
================================================== */

const azkar = [

  {
    text:
      "الحمد لله الذي أطعمني هذا، ورزقنيه، من غير حول مني ولا قوة",

    count: 1
  },


  {
    text:
      "الحمد لله حمدًا كثيرًا طيبًا مباركًا فيه، غير مكفي ولا مودع، ولا مستغنى عنه ربنا",

    count: 1
  }

];


/* ==================================================
   ⭐ نجوم الطفل
================================================== */

let stars =
  Number(
    localStorage.getItem(
      "childStars"
    )
  ) || 0;


document.getElementById(
  "stars"
).textContent = stars;


/* ==================================================
   📅 تحديد اليوم
================================================== */

const today =
  new Date()
    .toISOString()
    .slice(0, 10);


/* ==================================================
   💾 تحميل تقدم اليوم
================================================== */

let savedDay =
  localStorage.getItem(
    "foodAzkarDay"
  );


let counters = {};


if (
  savedDay === today
) {

  try {

    counters =
      JSON.parse(
        localStorage.getItem(
          "foodAzkarCounters"
        )
      ) || {};

  } catch (error) {

    counters = {};

  }

} else {

  counters = {};

  localStorage.setItem(
    "foodAzkarDay",
    today
  );

  localStorage.setItem(
    "foodAzkarCounters",
    JSON.stringify({})
  );

}


/* ==================================================
   بناء البطاقات
================================================== */

const container =
  document.getElementById(
    "azkar"
  );


azkar.forEach(
  (zekr, index) => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "zekr";


    const current =
      Number(
        counters[index]
      ) || 0;


    if (
      current >=
      zekr.count
    ) {

      card.classList.add(
        "completed"
      );

    }


    card.innerHTML = `

      <div class="zekr-number">
        ${index + 1}
      </div>


      <div class="zekr-text">
        ${escapeHTML(zekr.text)}
      </div>


      <div class="repeat-info">
        عدد التكرار: ${zekr.count}
      </div>


      <div class="controls">


        <button
          class="listen"
          id="listen-${index}"
          onclick="speakZekr(${index})"
        >

          🔊 استمع

        </button>


        <button
          class="counter"
          id="counter-${index}"
          onclick="countZekr(${index}, this)"
        >

          ${current} / ${zekr.count}

        </button>


        <button
          class="favorite"
          onclick="favoriteZekr(${index})"
          aria-label="إضافة للمفضلة"
        >

          ❤️

        </button>


      </div>

    `;


    container.appendChild(
      card
    );

  }
);


/* ==================================================
   حماية عرض النص
================================================== */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==================================================
   🔊 الصوت
================================================== */

let speakingIndex =
  null;


let speechVersion =
  0;


/* ==================================================
   🔊 قراءة الذكر
================================================== */

function speakZekr(index) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "عذرًا، جهازك لا يدعم تشغيل الصوت."
    );

    return;

  }


  if (
    speakingIndex === index
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  speechVersion++;


  const currentVersion =
    speechVersion;


  speakingIndex =
    index;


  const listenButton =
    document.getElementById(
      "listen-" + index
    );


  listenButton.textContent =
    "🔊 جاري القراءة...";


  listenButton.disabled =
    true;


  const utterance =
    new SpeechSynthesisUtterance(
      azkar[index].text
    );


  utterance.lang =
    "ar-SA";


  utterance.rate =
    0.75;


  utterance.pitch =
    1.05;


  utterance.volume =
    1;


  utterance.onend =
    function() {

      if (
        currentVersion !==
        speechVersion
      ) {

        return;

      }


      speakingIndex =
        null;


      listenButton.textContent =
        "🔊 استمع";


      listenButton.disabled =
        false;


      const counterButton =
        document.getElementById(
          "counter-" + index
        );


      countZekr(
        index,
        counterButton
      );

    };


  utterance.onerror =
    function() {

      if (
        currentVersion !==
        speechVersion
      ) {

        return;

      }


      speakingIndex =
        null;


      listenButton.textContent =
        "🔊 استمع";


      listenButton.disabled =
        false;

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   🏆 التشجيع
================================================== */

function encouragement() {

  const messages = [

    "أحسنت يا بطل! 🌟",

    "ما شاء الله عليك! 👏",

    "رائع يا بطل! ⭐",

    "ممتاز! بارك الله فيك ❤️"

  ];


  const message =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];


  speakText(
    message
  );

}


/* ==================================================
   🔊 نطق التشجيع
================================================== */

function speakText(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ar-SA";


  utterance.rate =
    0.85;


  utterance.pitch =
    1.15;


  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   ⭐ عداد الذكر
================================================== */

function countZekr(
  index,
  button
) {

  let current =
    Number(
      counters[index]
    ) || 0;


  /* لا نتجاوز العدد المطلوب */

  if (
    current >=
    azkar[index].count
  ) {

    return;

  }


  current++;


  counters[index] =
    current;


  button.textContent =
    current +
    " / " +
    azkar[index].count;


  /* حفظ التقدم */

  localStorage.setItem(
    "foodAzkarCounters",
    JSON.stringify(
      counters
    )
  );


  /* =========================
     اكتمال الذكر
  ========================= */

  if (
    current ===
    azkar[index].count
  ) {

    const card =
      button
        .parentElement
        .parentElement;


    card.classList.add(
      "completed"
    );


    /* =========================
       ⭐ نجمة واحدة فقط
    ========================= */

    const starKey =
      "foodStar_" +
      today +
      "_" +
      index;


    if (
      localStorage.getItem(
        starKey
      ) !== "1"
    ) {

      stars++;


      localStorage.setItem(
        "childStars",
        stars
      );


      localStorage.setItem(
        starKey,
        "1"
      );


      document.getElementById(
        "stars"
      ).textContent =
        stars;


      encouragement();

    }


    /* =========================
       🎉 فحص اكتمال القسم
    ========================= */

    const completed =
      azkar.every(
        (item, i) =>
          Number(
            counters[i]
          ) ===
          item.count
      );


    if (
      completed
    ) {

      setTimeout(
        function() {

          const finish =
            document.getElementById(
              "finishMessage"
            );


          finish.style.display =
            "block";


          speakText(
            "أحسنت يا بطل! بارك الله فيك، لقد أكملت أذكار الطعام"
          );


        },
        1200
      );

    }

  }

}


/* ==================================================
   ❤️ المفضلة
================================================== */

function favoriteZekr(index) {

  let favorites = [];


  try {

    favorites =
      JSON.parse(
        localStorage.getItem(
          "favoriteAzkar"
        )
      ) || [];

  } catch (error) {

    favorites = [];

  }


  if (
    !favorites.includes(
      azkar[index].text
    )
  ) {

    favorites.push(
      azkar[index].text
    );


    localStorage.setItem(
      "favoriteAzkar",
      JSON.stringify(
        favorites
      )
    );


    alert(
      "❤️ تمت إضافة الذكر إلى المفضلة"
    );

  } else {

    alert(
      "❤️ الذكر موجود بالفعل في المفضلة"
    );

  }

}


/* ==================================================
   🏠 العودة
================================================== */

function goBack() {

  window.location.href =
    "index.html";

}


/* ==================================================
   🎉 إظهار رسالة الإكمال
   إذا كان القسم مكتملًا مسبقًا
================================================== */

function checkFinished() {

  const completed =
    azkar.every(
      (item, i) =>
        Number(
          counters[i]
        ) ===
        item.count
    );


  if (
    completed
  ) {

    document.getElementById(
      "finishMessage"
    ).style.display =
      "block";

  }

}


checkFinished();


</script></body></html>
