<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75">

  <title>أذكار الطعام</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.13), transparent 25%),
        linear-gradient(145deg, #3b2209, #7a4b12 45%, #17463d);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(145deg, #9a641b, #5b350d);
      border-radius: 0 0 40px 40px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .icon {
      font-size: 60px;
      filter: drop-shadow(0 7px 7px rgba(0,0,0,.4));
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      opacity: .9;
      font-size: 15px;
    }

    .progress {
      margin: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 22px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .count {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .zekr {
      margin: 15px;
      padding: 22px 18px;
      border-radius: 25px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow:
        0 12px 25px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.12);
    }

    .zekr-text {
      font-size: 21px;
      line-height: 2;
      text-align: center;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      background: rgba(255,255,255,.14);
      box-shadow: 0 7px 15px rgba(0,0,0,.20);
    }

    .counter {
      background: #087f75;
      min-width: 90px;
    }

    .listen {
      background: rgba(255,193,7,.22);
    }

    button:active {
      transform: scale(.94);
    }

    .favorite {
      font-size: 22px;
    }

    .back {
      display: block;
      margin: 25px auto;
      background: rgba(255,255,255,.12);
    }

    .completed {
      opacity: .65;
      border: 2px solid rgba(159,245,223,.5);
    }

    .finish-message {
      display: none;
      margin: 20px 15px;
      padding: 22px;
      text-align: center;
      border-radius: 25px;
      background: rgba(255,255,255,.13);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="icon">🍎</div>

    <h1>أذكار الطعام</h1>

    <div class="subtitle">
      نذكر الله بعد الطعام 🌿
    </div>
  </header>

  <div class="progress">
    🌟 نجومك اليوم

    <div class="count">
      <span id="stars">0</span> ⭐
    </div>
  </div>

  <div id="azkar"></div>

  <div id="finishMessage" class="finish-message">
    🎉 أحسنت يا بطل! 🌟<br>
    بارك الله فيك ❤️
  </div>

  <button class="back" onclick="goBack()">
    🏠 العودة للرئيسية
  </button>

</div>

<script>

/* =========================
   🍎 أذكار الطعام
========================= */

const azkar = [

  {
    text: "الحمد لله الذي أطعمني هذا، ورزقنيه، من غير حول مني ولا قوة",
    count: 1
  },

  {
    text: "الحمد لله حمدًا كثيرًا طيبًا مباركًا فيه، غير مكفي ولا مودع، ولا مستغنى عنه ربنا",
    count: 1
  }

];


/* =========================
   ⭐ النجوم
========================= */

let stars =
  Number(localStorage.getItem("childStars")) || 0;

document.getElementById("stars").textContent = stars;


/* =========================
   إنشاء الأذكار
========================= */

const container =
  document.getElementById("azkar");

azkar.forEach((zekr, index) => {

  const card = document.createElement("div");

  card.className = "zekr";

  card.innerHTML = `

    <div class="zekr-text">
      ${zekr.text}
    </div>

    <div class="controls">

      <button
        class="listen"
        id="listen-${index}"
        onclick="speakZekr(${index})">
        🔊 استمع
      </button>

      <button
        class="counter"
        id="counter-${index}"
        onclick="countZekr(${index}, this)">
        0 / ${zekr.count}
      </button>

      <button
        class="favorite"
        onclick="favoriteZekr(${index})">
        ❤️
      </button>

    </div>

  `;

  container.appendChild(card);

});


/* =========================
   العدادات
========================= */

let counters = {};


/* =========================
   🔊 التحكم في الصوت
========================= */

let speakingIndex = null;

let speechVersion = 0;


function speakZekr(index) {

  if (!("speechSynthesis" in window)) {

    alert("عذرًا، جهازك لا يدعم تشغيل الصوت.");

    return;
  }


  /* منع الضغط المتكرر */

  if (speakingIndex === index) {
    return;
  }


  /* إلغاء أي قراءة سابقة */

  window.speechSynthesis.cancel();

  speechVersion++;

  const currentVersion = speechVersion;

  speakingIndex = index;


  const listenButton =
    document.getElementById("listen-" + index);

  listenButton.textContent =
    "🔊 جاري القراءة...";


  const utterance =
    new SpeechSynthesisUtterance(
      azkar[index].text
    );


  utterance.lang = "ar-SA";
  utterance.rate = 0.75;
  utterance.pitch = 1.05;
  utterance.volume = 1;


  /* انتهاء الصوت = احتساب مرة واحدة */

  utterance.onend = function() {

    if (currentVersion !== speechVersion) {
      return;
    }


    speakingIndex = null;

    listenButton.textContent =
      "🔊 استمع";


    const counterButton =
      document.getElementById(
        "counter-" + index
      );


    countZekr(
      index,
      counterButton
    );

  };


  utterance.onerror = function() {

    if (currentVersion !== speechVersion) {
      return;
    }

    speakingIndex = null;

    listenButton.textContent =
      "🔊 استمع";

  };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   🏆 التشجيع
========================= */

function encouragement() {

  const messages = [

    "أحسنت يا بطل! 🌟",

    "ما شاء الله عليك! 👏",

    "رائع يا بطل! ⭐",

    "ممتاز! بارك الله فيك ❤️"

  ];


  const message =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];


  speakText(message);

}


/* =========================
   🔊 نطق التشجيع
========================= */

function speakText(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang = "ar-SA";
  utterance.rate = 0.85;
  utterance.pitch = 1.15;
  utterance.volume = 1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   ⭐ عدّ الذكر
========================= */

function countZekr(index, button) {

  if (!counters[index]) {
    counters[index] = 0;
  }


  if (
    counters[index] <
    azkar[index].count
  ) {

    counters[index]++;


    button.textContent =
      counters[index] +
      " / " +
      azkar[index].count;


    /* اكتمال الذكر */

    if (
      counters[index] ===
      azkar[index].count
    ) {

      button
        .parentElement
        .parentElement
        .classList
        .add("completed");


      /* ⭐ نجمة واحدة */

      stars++;


      localStorage.setItem(
        "childStars",
        stars
      );


      document.getElementById(
        "stars"
      ).textContent = stars;


      /* 🏆 تشجيع الطفل */

      encouragement();


      /* 🎉 إكمال جميع أذكار الطعام */

      const completed =
        azkar.every(
          (item, i) =>
            counters[i] ===
            item.count
        );


      if (completed) {

        setTimeout(() => {

          const finish =
            document.getElementById(
              "finishMessage"
            );


          finish.style.display =
            "block";


          speakText(
            "أحسنت يا بطل! بارك الله فيك، لقد أكملت أذكار الطعام"
          );

        }, 1200);

      }

    }

  }

}


/* =========================
   ❤️ المفضلة
========================= */

function favoriteZekr(index) {

  let favorites =
    JSON.parse(
      localStorage.getItem(
        "favoriteAzkar"
      )
    ) || [];


  if (
    !favorites.includes(
      azkar[index].text
    )
  ) {

    favorites.push(
      azkar[index].text
    );


    localStorage.setItem(
      "favoriteAzkar",
      JSON.stringify(favorites)
    );


    alert(
      "❤️ تمت إضافة الذكر إلى المفضلة"
    );

  } else {

    alert(
      "❤️ الذكر موجود بالفعل في المفضلة"
    );

  }

}


/* =========================
   🏠 العودة
========================= */

function goBack() {

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
