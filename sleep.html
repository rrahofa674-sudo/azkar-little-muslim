/* ==================================================
   😴 أذكار النوم
================================================== */

const azkar = [

  {
    text:
      "يجمع كفيه ثم ينفث فيهما، فيقرأ فيهما: بسم الله الرحمن الرحيم ﴿قل هو الله أحد * الله الصمد * لم يلد ولم يولد * ولم يكن له كفوا أحد﴾. بسم الله الرحمن الرحيم ﴿قل أعوذ برب الفلق * من شر ما خلق * ومن شر غاسق إذا وقب * ومن شر النفاثات في العقد * ومن شر حاسد إذا حسد﴾. بسم الله الرحمن الرحيم ﴿قل أعوذ برب الناس * ملك الناس * إله الناس * من شر الوسواس الخناس * الذي يوسوس في صدور الناس * من الجنة والناس﴾. ثم يمسح بهما ما استطاع من جسده، يبدأ بهما على رأسه ووجهه وما أقبل من جسده.",

    count: 3,

    note:
      "يفعل ذلك ثلاث مرات"
  },

  {
    text:
      "﴿الله لا إله إلا هو الحي القيوم لا تأخذه سنة ولا نوم له ما في السموات وما في الأرض من ذا الذي يشفع عنده إلا بإذنه يعلم ما بين أيديهم وما خلفهم ولا يحيطون بشيء من علمه إلا بما شاء وسع كرسيه السموات والأرض ولا يؤوده حفظهما وهو العلي العظيم﴾",

    count: 1
  },

  {
    text:
      "﴿آمن الرسول بما أنزل إليه من ربه والمؤمنون كل آمن بالله وملائكته وكتبه ورسله لا نفرق بين أحد من رسله وقالوا سمعنا وأطعنا غفرانك ربنا وإليك المصير * لا يكلف الله نفسا إلا وسعها لها ما كسبت وعليها ما اكتسبت ربنا لا تؤاخذنا إن نسينا أو أخطأنا ربنا ولا تحمل علينا إصرا كما حملته على الذين من قبلنا ربنا ولا تحملنا ما لا طاقة لنا به واعف عنا واغفر لنا وارحمنا أنت مولانا فانصرنا على القوم الكافرين﴾",

    count: 1
  },

  {
    text:
      "باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها، بما تحفظ به عبادك الصالحين",

    count: 1
  },

  {
    text:
      "اللهم إنك خلقت نفسي وأنت توفاها، لك مماتها ومحياها، إن أحييتها فاحفظها، وإن أمتها فاغفر لها. اللهم إني أسألك العافية",

    count: 1
  },

  {
    text:
      "اللهم قني عذابك يوم تبعث عبادك",

    count: 1
  },

  {
    text:
      "باسمك اللهم أموت وأحيا",

    count: 1
  },

  {
    text:
      "سبحان الله",

    count: 33
  },

  {
    text:
      "الحمد لله",

    count: 33
  },

  {
    text:
      "والله أكبر",

    count: 33
  },

  {
    text:
      "اللهم رب السموات السبع ورب الأرض، ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل، والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته. اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر",

    count: 1
  },

  {
    text:
      "الحمد لله الذي أطعمنا وسقانا، وكفانا، وآوانا، فكم ممن لا كافي له ولا مؤوي",

    count: 1
  },

  {
    text:
      "اللهم عالم الغيب والشهادة فاطر السموات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي، ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءا، أو أجره إلى مسلم",

    count: 1
  },

  {
    text:
      "قراءة سورة الملك",

    count: 1,

    note:
      "تُقرأ سورة الملك كاملة"
  },

  {
    text:
      "اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبة ورهبة إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت، وبنبيك الذي أرسلت",

    count: 1
  }

];


/* ==================================================
   📅 التاريخ اليومي
================================================== */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return year + "-" + month + "-" + day;
}


const today = getToday();


/* ==================================================
   💾 بيانات أذكار النوم اليومية
================================================== */

let savedData =
  JSON.parse(
    localStorage.getItem(
      "sleepAzkarProgress"
    )
  ) || {};


if (savedData.date !== today) {

  savedData = {

    date: today,

    counters: {},

    completed: {},

    stars: 0

  };

  localStorage.setItem(
    "sleepAzkarProgress",
    JSON.stringify(savedData)
  );
}


function saveData() {

  localStorage.setItem(
    "sleepAzkarProgress",
    JSON.stringify(savedData)
  );

}


/* ==================================================
   ⭐ مجموع النجوم العام
================================================== */

let stars =
  Number(
    localStorage.getItem(
      "childStars"
    )
  ) || 0;


document.getElementById(
  "stars"
).textContent = stars;


/* ==================================================
   ❤️ المفضلة
================================================== */

let favorites =
  JSON.parse(
    localStorage.getItem(
      "favoriteAzkar"
    )
  ) || [];


/* ==================================================
   إنشاء الأذكار
================================================== */

const container =
  document.getElementById(
    "azkar"
  );


azkar.forEach(
  (zekr, index) => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "zekr";

    card.id =
      "card-" + index;


    if (
      savedData.completed[index]
    ) {

      card.classList.add(
        "completed"
      );

    }


    const isFavorite =
      favorites.includes(
        zekr.text
      );


    card.innerHTML = `

      <div class="zekr-text">
        ${zekr.text}
      </div>

      ${
        zekr.note
          ? `
            <div class="note">
              ${zekr.note}
            </div>
          `
          : ""
      }

      <div class="controls">

        <button
          class="listen"
          id="listen-${index}"
          onclick="speakZekr(${index})">

          🔊 استمع

        </button>


        <button
          class="counter"
          id="counter-${index}"
          onclick="countZekr(${index})">

          ${
            savedData.counters[index] || 0
          }
          / ${zekr.count}

        </button>


        <button
          class="favorite ${
            isFavorite ? "active" : ""
          }"
          id="favorite-${index}"
          onclick="toggleFavorite(${index})">

          ${
            isFavorite
              ? "❤️ في المفضلة"
              : "🤍 أضف للمفضلة"
          }

        </button>

      </div>


      <div
        class="item-message"
        id="message-${index}">

        ${
          savedData.completed[index]
            ? "🌟 أحسنت! أكملت هذا الذكر ❤️"
            : ""
        }

      </div>

    `;


    container.appendChild(
      card
    );

  }
);


/* ==================================================
   🔊 التحكم في الصوت
================================================== */

let speakingIndex = null;

let speechVersion = 0;


function speakZekr(index) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "عذرًا، جهازك لا يدعم تشغيل الصوت."
    );

    return;

  }


  if (
    speakingIndex !== null
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  speechVersion++;


  const currentVersion =
    speechVersion;


  speakingIndex =
    index;


  const listenButton =
    document.getElementById(
      "listen-" + index
    );


  listenButton.disabled =
    true;


  listenButton.textContent =
    "🔊 جاري القراءة...";


  const utterance =
    new SpeechSynthesisUtterance(
      azkar[index].text
    );


  utterance.lang =
    "ar-SA";

  utterance.rate =
    0.75;

  utterance.pitch =
    1.05;

  utterance.volume =
    1;


  utterance.onend =
    function() {

      if (
        currentVersion !==
        speechVersion
      ) {

        return;

      }


      speakingIndex =
        null;


      listenButton.disabled =
        false;


      listenButton.textContent =
        "🔊 استمع";


      /* بعد انتهاء القراءة
         نزيد العداد مرة واحدة */

      countZekr(index);

    };


  utterance.onerror =
    function() {

      if (
        currentVersion !==
        speechVersion
      ) {

        return;

      }


      speakingIndex =
        null;


      listenButton.disabled =
        false;


      listenButton.textContent =
        "🔊 استمع";

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   ⭐ عد الذكر
================================================== */

function countZekr(index) {

  const max =
    azkar[index].count;


  if (
    savedData.counters[index] === undefined
  ) {

    savedData.counters[index] =
      0;

  }


  if (
    savedData.counters[index] >=
    max
  ) {

    return;

  }


  savedData.counters[index]++;


  const counter =
    document.getElementById(
      "counter-" + index
    );


  counter.textContent =
    savedData.counters[index] +
    " / " +
    max;


  /* ==================================================
     اكتمال الذكر
  ================================================== */

  if (
    savedData.counters[index] >=
    max
  ) {

    savedData.completed[index] =
      true;


    const card =
      document.getElementById(
        "card-" + index
      );


    card.classList.add(
      "completed"
    );


    const message =
      document.getElementById(
        "message-" + index
      );


    message.textContent =
      "🌟 أحسنت يا بطل! أكملت هذا الذكر ❤️";


    /* ⭐ نجمة واحدة فقط */

    if (
      !savedData.completedStar ||
      !savedData.completedStar[index]
    ) {

      if (
        !savedData.completedStar
      ) {

        savedData.completedStar =
          {};

      }


      savedData.completedStar[index] =
        true;


      stars++;


      localStorage.setItem(
        "childStars",
        stars
      );


      document.getElementById(
        "stars"
      ).textContent =
        stars;


      encouragement();

    }


    checkAllCompleted();

  }


  saveData();

}


/* ==================================================
   🏆 التشجيع
================================================== */

function encouragement() {

  const messages = [

    "أحسنت يا بطل! 🌟",

    "ما شاء الله عليك! 👏",

    "رائع يا بطل! ⭐",

    "ممتاز! بارك الله فيك ❤️",

    "بطل! استمر في ذكر الله 🌙",

    "ما شاء الله، أنت رائع! 🌟"

  ];


  const message =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];


  speakText(message);

}


/* ==================================================
   🔊 نطق التشجيع
================================================== */

function speakText(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ar-SA";

  utterance.rate =
    0.85;

  utterance.pitch =
    1.15;

  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   🎉 فحص إكمال القسم
================================================== */

function checkAllCompleted() {

  const completed =
    azkar.every(
      (item, index) =>
        savedData.counters[index] >=
        item.count
    );


  const finish =
    document.getElementById(
      "finishMessage"
    );


  if (completed) {

    finish.style.display =
      "block";

  } else {

    finish.style.display =
      "none";

  }

}


/* ==================================================
   ❤️ إضافة / إزالة من المفضلة
================================================== */

function toggleFavorite(index) {

  const text =
    azkar[index].text;


  const position =
    favorites.indexOf(text);


  const button =
    document.getElementById(
      "favorite-" + index
    );


  if (position === -1) {

    favorites.push(text);


    button.classList.add(
      "active"
    );


    button.textContent =
      "❤️ في المفضلة";


    alert(
      "❤️ تمت إضافة الذكر إلى المفضلة"
    );

  } else {

    favorites.splice(
      position,
      1
    );


    button.classList.remove(
      "active"
    );


    button.textContent =
      "🤍 أضف للمفضلة";


    alert(
      "🤍 تمت إزالة الذكر من المفضلة"
    );

  }


  localStorage.setItem(
    "favoriteAzkar",
    JSON.stringify(
      favorites
    )
  );

}


/* ==================================================
   🏠 العودة للرئيسية
================================================== */
