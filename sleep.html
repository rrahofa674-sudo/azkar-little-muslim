<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75">

  <title>أذكار النوم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at 75% 10%, rgba(255,255,255,.12), transparent 25%),
        linear-gradient(145deg, #07152f, #182d59 45%, #092f3b);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(145deg, #172e5c, #091b3b);
      border-radius: 0 0 40px 40px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .icon {
      font-size: 60px;
      filter: drop-shadow(0 7px 7px rgba(0,0,0,.4));
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      opacity: .9;
      font-size: 15px;
    }

    .progress {
      margin: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 22px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .count {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .zekr {
      margin: 15px;
      padding: 22px 18px;
      border-radius: 25px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow:
        0 12px 25px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.12);
    }

    .zekr-text {
      font-size: 21px;
      line-height: 2;
      text-align: center;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      opacity: .85;
      line-height: 1.8;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      background: rgba(255,255,255,.14);
      box-shadow: 0 7px 15px rgba(0,0,0,.20);
    }

    .counter {
      background: #087f75;
      min-width: 90px;
    }

    .listen {
      background: rgba(255,193,7,.22);
    }

    button:active {
      transform: scale(.94);
    }

    .favorite {
      font-size: 22px;
    }

    .back {
      display: block;
      margin: 25px auto;
      background: rgba(255,255,255,.12);
    }

    .completed {
      opacity: .65;
      border: 2px solid rgba(159,245,223,.5);
    }

    .finish-message {
      display: none;
      margin: 20px 15px;
      padding: 22px;
      text-align: center;
      border-radius: 25px;
      background: rgba(255,255,255,.13);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="icon">⭐</div>

    <h1>أذكار النوم</h1>

    <div class="subtitle">
      اختم يومك بذكر الله وطمأنينة القلب 🌙
    </div>
  </header>


  <div class="progress">
    🌟 نجومك اليوم

    <div class="count">
      <span id="stars">0</span> ⭐
    </div>
  </div>


  <div id="azkar"></div>


  <div id="finishMessage" class="finish-message">
    🎉 أحسنت يا بطل! 🌟<br>
    بارك الله فيك ❤️
  </div>


  <button class="back" onclick="goBack()">
    🏠 العودة للرئيسية
  </button>

</div>


<script>

/* =========================
   😴 أذكار النوم
========================= */

const azkar = [

  {
    text: "يجمع كفيه ثم ينفث فيهما، فيقرأ فيهما: بسم الله الرحمن الرحيم ﴿قل هو الله أحد * الله الصمد * لم يلد ولم يولد * ولم يكن له كفوا أحد﴾. بسم الله الرحمن الرحيم ﴿قل أعوذ برب الفلق * من شر ما خلق * ومن شر غاسق إذا وقب * ومن شر النفاثات في العقد * ومن شر حاسد إذا حسد﴾. بسم الله الرحمن الرحيم ﴿قل أعوذ برب الناس * ملك الناس * إله الناس * من شر الوسواس الخناس * الذي يوسوس في صدور الناس * من الجنة والناس﴾. ثم يمسح بهما ما استطاع من جسده، يبدأ بهما على رأسه ووجهه وما أقبل من جسده.",
    count: 3,
    note: "يفعل ذلك ثلاث مرات"
  },

  {
    text: "﴿الله لا إله إلا هو الحي القيوم لا تأخذه سنة ولا نوم له ما في السموات وما في الأرض من ذا الذي يشفع عنده إلا بإذنه يعلم ما بين أيديهم وما خلفهم ولا يحيطون بشيء من علمه إلا بما شاء وسع كرسيه السموات والأرض ولا يؤوده حفظهما وهو العلي العظيم﴾",
    count: 1
  },

  {
    text: "﴿آمن الرسول بما أنزل إليه من ربه والمؤمنون كل آمن بالله وملائكته وكتبه ورسله لا نفرق بين أحد من رسله وقالوا سمعنا وأطعنا غفرانك ربنا وإليك المصير * لا يكلف الله نفسا إلا وسعها لها ما كسبت وعليها ما اكتسبت ربنا لا تؤاخذنا إن نسينا أو أخطأنا ربنا ولا تحمل علينا إصرا كما حملته على الذين من قبلنا ربنا ولا تحملنا ما لا طاقة لنا به واعف عنا واغفر لنا وارحمنا أنت مولانا فانصرنا على القوم الكافرين﴾",
    count: 1
  },

  {
    text: "باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها، بما تحفظ به عبادك الصالحين",
    count: 1
  },

  {
    text: "اللهم إنك خلقت نفسي وأنت توفاها، لك مماتها ومحياها، إن أحييتها فاحفظها، وإن أمتها فاغفر لها. اللهم إني أسألك العافية",
    count: 1
  },

  {
    text: "اللهم قني عذابك يوم تبعث عبادك",
    count: 1
  },

  {
    text: "باسمك اللهم أموت وأحيا",
    count: 1
  },

  {
    text: "سبحان الله",
    count: 33
  },

  {
    text: "الحمد لله",
    count: 33
  },

  {
    text: "والله أكبر",
    count: 33
  },

  {
    text: "اللهم رب السموات السبع ورب الأرض، ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل، والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته. اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر",
    count: 1
  },

  {
    text: "الحمد لله الذي أطعمنا وسقانا، وكفانا، وآوانا، فكم ممن لا كافي له ولا مؤوي",
    count: 1
  },

  {
    text: "اللهم عالم الغيب والشهادة فاطر السموات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي، ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءا، أو أجره إلى مسلم",
    count: 1
  },

  {
    text: "قراءة سورة الملك",
    count: 1,
    note: "تُقرأ سورة الملك كاملة"
  },

  {
    text: "اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبة ورهبة إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت، وبنبيك الذي أرسلت",
    count: 1
  }

];


/* =========================
   ⭐ النجوم
========================= */

let stars =
  Number(localStorage.getItem("childStars")) || 0;

document.getElementById("stars").textContent = stars;


/* =========================
   إنشاء الأذكار
========================= */

const container =
  document.getElementById("azkar");


azkar.forEach((zekr, index) => {

  const card =
    document.createElement("div");

  card.className = "zekr";


  card.innerHTML = `

    <div class="zekr-text">
      ${zekr.text}
    </div>

    ${
      zekr.note
      ? `<div class="note">${zekr.note}</div>`
      : ""
    }

    <div class="controls">

      <button
        class="listen"
        id="listen-${index}"
        onclick="speakZekr(${index})">
        🔊 استمع
      </button>

      <button
        class="counter"
        id="counter-${index}"
        onclick="countZekr(${index}, this)">
        0 / ${zekr.count}
      </button>

      <button
        class="favorite"
        onclick="favoriteZekr(${index})">
        ❤️
      </button>

    </div>

  `;

  container.appendChild(card);

});


/* =========================
   العدادات
========================= */

let counters = {};


/* =========================
   🔊 التحكم في الصوت
========================= */

let speakingIndex = null;

let speechVersion = 0;


function speakZekr(index) {

  if (!("speechSynthesis" in window)) {

    alert("عذرًا، جهازك لا يدعم تشغيل الصوت.");

    return;
  }


  /* منع الضغط أثناء القراءة */

  if (speakingIndex === index) {
    return;
  }


  /* إلغاء أي قراءة سابقة */

  window.speechSynthesis.cancel();

  speechVersion++;

  const currentVersion =
    speechVersion;

  speakingIndex = index;


  const listenButton =
    document.getElementById(
      "listen-" + index
    );


  listenButton.textContent =
    "🔊 جاري القراءة...";


  const utterance =
    new SpeechSynthesisUtterance(
      azkar[index].text
    );


  utterance.lang = "ar-SA";
  utterance.rate = 0.75;
  utterance.pitch = 1.05;
  utterance.volume = 1;


  /* انتهاء الصوت = احتساب مرة واحدة */

  utterance.onend = function() {

    if (
      currentVersion !==
      speechVersion
    ) {
      return;
    }


    speakingIndex = null;

    listenButton.textContent =
      "🔊 استمع";


    const counterButton =
      document.getElementById(
        "counter-" + index
      );


    countZekr(
      index,
      counterButton
    );

  };


  utterance.onerror = function() {

    if (
      currentVersion !==
      speechVersion
    ) {
      return;
    }


    speakingIndex = null;

    listenButton.textContent =
      "🔊 استمع";

  };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   🏆 التشجيع
========================= */

function encouragement() {

  const messages = [

    "أحسنت يا بطل! 🌟",

    "ما شاء الله عليك! 👏",

    "رائع يا بطل! ⭐",

    "ممتاز! بارك الله فيك ❤️"

  ];


  const message =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];


  speakText(message);

}


/* =========================
   🔊 نطق التشجيع
========================= */

function speakText(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang = "ar-SA";
  utterance.rate = 0.85;
  utterance.pitch = 1.15;
  utterance.volume = 1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   ⭐ عدّ الذكر
========================= */

function countZekr(index, button) {

  if (!counters[index]) {
    counters[index] = 0;
  }


  if (
    counters[index] <
    azkar[index].count
  ) {

    counters[index]++;


    button.textContent =
      counters[index] +
      " / " +
      azkar[index].count;


    /* اكتمال الذكر */

    if (
      counters[index] ===
      azkar[index].count
    ) {

      button
        .parentElement
        .parentElement
        .classList
        .add("completed");


      /* ⭐ نجمة واحدة عند إكمال الذكر */

      stars++;


      localStorage.setItem(
        "childStars",
        stars
      );


      document.getElementById(
        "stars"
      ).textContent = stars;


      /* 🏆 تشجيع */

      encouragement();


      /* 🎉 فحص إكمال القسم */

      const completed =
        azkar.every(
          (item, i) =>
            counters[i] ===
            item.count
        );


      if (completed) {

        setTimeout(() => {

          const finish =
            document.getElementById(
              "finishMessage"
            );


          finish.style.display =
            "block";


          speakText(
            "أحسنت يا بطل! بارك الله فيك، لقد أكملت أذكار النوم"
          );

        }, 1200);

      }

    }

  }

}


/* =========================
   ❤️ المفضلة
========================= */

function favoriteZekr(index) {

  let favorites =
    JSON.parse(
      localStorage.getItem(
        "favoriteAzkar"
      )
    ) || [];


  if (
    !favorites.includes(
      azkar[index].text
    )
  ) {

    favorites.push(
      azkar[index].text
    );


    localStorage.setItem(
      "favoriteAzkar",
      JSON.stringify(favorites)
    );


    alert(
      "❤️ تمت إضافة الذكر إلى المفضلة"
    );

  } else {

    alert(
      "❤️ الذكر موجود بالفعل في المفضلة"
    );

  }

}


/* =========================
   🏠 العودة
========================= */

function goBack() {

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
