<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75">

  <title>أذكار المساء</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255,255,255,.15),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          #062e2b,
          #0b5d58 45%,
          #092f3b
        );

      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      padding: 30px 15px;

      background:
        linear-gradient(
          145deg,
          #0b766e,
          #064b55
        );

      border-radius: 0 0 40px 40px;

      box-shadow:
        0 12px 30px rgba(0,0,0,.30);
    }

    .icon {
      font-size: 60px;

      filter:
        drop-shadow(
          0 7px 7px rgba(0,0,0,.35)
        );
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      opacity: .9;
      font-size: 15px;
    }

    .progress {
      margin: 20px;
      padding: 15px;

      text-align: center;

      border-radius: 22px;

      background:
        rgba(255,255,255,.10);

      box-shadow:
        0 10px 25px rgba(0,0,0,.20);
    }

    .count {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .zekr {
      margin: 15px;
      padding: 22px 18px;

      border-radius: 25px;

      background:
        rgba(255,255,255,.10);

      border:
        1px solid rgba(255,255,255,.16);

      box-shadow:
        0 12px 25px rgba(0,0,0,.25),
        inset 0 1px 2px rgba(255,255,255,.12);

      transition:
        .3s ease;
    }

    .zekr.completed {
      opacity: .65;

      border:
        2px solid rgba(159,245,223,.5);
    }

    .zekr-text {
      font-size: 21px;
      line-height: 2.1;

      text-align: center;

      font-weight: bold;
    }

    .repeat-info {
      text-align: center;

      margin-top: 12px;

      opacity: .8;

      font-size: 14px;
    }

    .controls {
      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 20px;

      flex-wrap: wrap;
    }

    button {
      border: none;

      cursor: pointer;

      color: white;

      border-radius: 18px;

      padding: 12px 18px;

      font-size: 16px;

      font-weight: bold;

      background:
        rgba(255,255,255,.14);

      box-shadow:
        0 7px 15px rgba(0,0,0,.20);

      transition:
        transform .15s ease,
        opacity .2s ease;
    }

    button:active {
      transform:
        scale(.94);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .counter {
      background:
        #087f75;

      min-width: 90px;
    }

    .listen {
      background:
        rgba(255,193,7,.22);
    }

    .favorite {
      font-size: 22px;

      padding-left: 15px;
      padding-right: 15px;
    }

    .back {
      display: block;

      margin: 25px auto;

      background:
        rgba(255,255,255,.12);
    }

    .finish-message {
      display: none;

      margin: 20px 15px;

      padding: 22px;

      text-align: center;

      border-radius: 25px;

      background:
        rgba(255,255,255,.13);

      box-shadow:
        0 10px 25px rgba(0,0,0,.25);

      font-size: 22px;

      font-weight: bold;

      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="icon">
      🌙
    </div>

    <h1>
      أذكار المساء
    </h1>

    <div class="subtitle">
      اختم يومك بذكر الله 🌿
    </div>

  </header>


  <div class="progress">

    🌟 نجومك اليوم

    <div class="count">

      <span id="stars">
        0
      </span>

      ⭐

    </div>

  </div>


  <div id="azkar"></div>


  <div
    id="finishMessage"
    class="finish-message">

    🎉 أحسنت يا بطل! 🌟

    <br>

    لقد أكملت أذكار المساء

    <br>

    بارك الله فيك ❤️

  </div>


  <button
    class="back"
    onclick="goBack()">

    🏠 العودة للرئيسية

  </button>

</div>


<script>


/* ==================================================
   🌙 أذكار المساء
   نفس الأذكار والأعداد بدون تغيير
   ================================================== */

const azkar = [

  {
    text: "الله لا إله إلا هو الحي القيوم لا تأخذه سنة ولا نوم له ما في السموات وما في الأرض من ذا الذي يشفع عنده إلا بإذنه يعلم ما بين أيديهم وما خلفهم ولا يحيطون بشيء من علمه إلا بما شاء وسع كرسيه السموات والأرض ولا يؤوده حفظهما وهو العلي العظيم",
    count: 1
  },

  {
    text: "بسم الله الرحمن الرحيم ﴿قل هو الله أحد* الله الصمد* لم يلد ولم يولد* ولم يكن له كفوا أحد﴾",
    count: 3
  },

  {
    text: "بسم الله الرحمن الرحيم ﴿قل أعوذ برب الفلق* من شر ما خلق* ومن شر غاسق إذا وقب* ومن شر النفاثات في العقد* ومن شر حاسد إذا حسد﴾",
    count: 3
  },

  {
    text: "بسم الله الرحمن الرحيم ﴿قل أعوذ برب الناس* ملك الناس* إله الناس* من شر الوسواس الخناس* الذي يوسوس في صدور الناس* من الجنة والناس﴾",
    count: 3
  },

  {
    text: "أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذه الليلة وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة وشر ما بعدها، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر",
    count: 1
  },

  {
    text: "اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت وإليك المصير",
    count: 1
  },

  {
    text: "اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت",
    count: 1
  },

  {
    text: "اللهم إني أمسيت أشهدك، وأشهد حملة عرشك، وملائكتك، وجميع خلقك، أنك أنت الله لا إله إلا أنت وحدك لا شريك لك، وأن محمدا عبدك ورسولك",
    count: 4
  },

  {
    text: "اللهم ما أمسى بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر",
    count: 1
  },

  {
    text: "اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت. اللهم إني أعوذ بك من الكفر، والفقر، وأعوذ بك من عذاب القبر، لا إله إلا أنت",
    count: 3
  },

  {
    text: "حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم",
    count: 7
  },

  {
    text: "اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي، وآمن روعاتي، اللهم احفظني من بين يدي، ومن خلفي، وعن يميني، وعن شمالي، ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي",
    count: 1
  },

  {
    text: "اللهم عالم الغيب والشهادة فاطر السموات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي، ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءا، أو أجره إلى مسلم",
    count: 1
  },

  {
    text: "بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم",
    count: 3
  },

  {
    text: "رضيت بالله ربا، وبالإسلام دينا، وبمحمد صلى الله عليه وسلم نبيا",
    count: 3
  },

  {
    text: "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين",
    count: 1
  },

  {
    text: "أمسينا وأمسى الملك لله رب العالمين، اللهم إني أسألك خير هذه الليلة: فتحها، ونصرها، ونورها، وبركتها، وهداها، وأعوذ بك من شر ما فيها وشر ما بعدها",
    count: 1
  },

  {
    text: "أمسينا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم، حنيفا مسلما وما كان من المشركين",
    count: 1
  },

  {
    text: "سبحان الله وبحمده",
    count: 100
  },

  {
    text: "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير",
    count: 10
  },

  {
    text: "أستغفر الله وأتوب إليه",
    count: 100
  },

  {
    text: "أعوذ بكلمات الله التامات من شر ما خلق",
    count: 3
  },

  {
    text: "اللهم صل وسلم على نبينا محمد",
    count: 10
  }

];


/* ==================================================
   ⭐ النجوم
   ================================================== */

let stars =
  Number(
    localStorage.getItem("childStars")
  ) || 0;

document.getElementById("stars")
  .textContent = stars;


/* ==================================================
   📅 التاريخ المحلي
   ================================================== */

function getLocalDateKey() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}

const today =
  getLocalDateKey();


/* ==================================================
   تحميل تقدم أذكار المساء لهذا اليوم
   ================================================== */

let savedDay =
  localStorage.getItem(
    "eveningAzkarDay"
  );

let counters = {};


if (savedDay === today) {

  try {

    counters =
      JSON.parse(
        localStorage.getItem(
          "eveningAzkarCounters"
        )
      ) || {};

  } catch (error) {

    counters = {};

  }

} else {

  counters = {};

  localStorage.setItem(
    "eveningAzkarDay",
    today
  );

  localStorage.setItem(
    "eveningAzkarCounters",
    JSON.stringify({})
  );

}


/* ==================================================
   بناء البطاقات
   ================================================== */

const container =
  document.getElementById(
    "azkar"
  );


azkar.forEach(
  (zekr, index) => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "zekr";


    const current =
      Math.min(
        Number(
          counters[index]
        ) || 0,
        zekr.count
      );


    counters[index] =
      current;


    if (
      current >=
      zekr.count
    ) {

      card.classList.add(
        "completed"
      );

    }


    card.innerHTML = `

      <div class="zekr-text">
        ${zekr.text}
      </div>

      <div class="repeat-info">
        عدد التكرار: ${zekr.count}
      </div>

      <div class="controls">

        <button
          class="listen"
          id="listen-${index}"
          onclick="speakZekr(${index})">

          🔊 استمع

        </button>

        <button
          class="counter"
          id="counter-${index}"
          onclick="countZekr(${index}, this)">

          ${current} / ${zekr.count}

        </button>

        <button
          class="favorite"
          aria-label="إضافة إلى المفضلة"
          onclick="favoriteZekr(${index})">

          ❤️

        </button>

      </div>

    `;


    container.appendChild(
      card
    );

  }
);


/* ==================================================
   حفظ العدادات بعد تنظيفها
   ================================================== */

localStorage.setItem(
  "eveningAzkarCounters",
  JSON.stringify(counters)
);


/* ==================================================
   🔊 نظام الصوت
   ================================================== */

let speakingIndex =
  null;

let speechVersion =
  0;

let speechType =
  null;


/* ==================================================
   إيقاف الصوت الحالي
   ================================================== */

function stopSpeech() {

  speechVersion++;

  window.speechSynthesis.cancel();

  speakingIndex =
    null;

  speechType =
    null;


  document
    .querySelectorAll(
      ".listen"
    )
    .forEach(
      button => {

        button.disabled =
          false;

        button.textContent =
          "🔊 استمع";

      }
    );

}


/* ==================================================
   🔊 قراءة الذكر
   ================================================== */

function speakZekr(index) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "عذرًا، جهازك لا يدعم تشغيل الصوت."
    );

    return;

  }


  /*
   * منع تشغيل ذكر آخر أثناء القراءة.
   */

  if (
    speakingIndex !== null
  ) {

    return;

  }


  /*
   * إلغاء أي صوت سابق.
   */

  window.speechSynthesis.cancel();

  speechVersion++;


  const currentVersion =
    speechVersion;


  speakingIndex =
    index;

  speechType =
    "zekr";


  const listenButton =
    document.getElementById(
      "listen-" + index
    );


  listenButton.textContent =
    "🔊 جاري القراءة...";


  listenButton.disabled =
    true;


  const utterance =
    new SpeechSynthesisUtterance(
      azkar[index].text
    );


  utterance.lang =
    "ar-SA";

  utterance.rate =
    0.75;

  utterance.pitch =
    1.05;

  utterance.volume =
    1;


  /*
   * بعد انتهاء القراءة بالكامل:
   * يزيد العداد مرة واحدة.
   */

  utterance.onend =
    function() {

      if (
        currentVersion !==
          speechVersion ||
        speechType !==
          "zekr"
      ) {

        return;

      }


      speakingIndex =
        null;

      speechType =
        null;


      listenButton.textContent =
        "🔊 استمع";


      listenButton.disabled =
        false;


      const counterButton =
        document.getElementById(
          "counter-" + index
        );


      countZekr(
        index,
        counterButton
      );

    };


  utterance.onerror =
    function() {

      if (
        currentVersion !==
        speechVersion
      ) {

        return;

      }


      speakingIndex =
        null;

      speechType =
        null;


      listenButton.textContent =
        "🔊 استمع";


      listenButton.disabled =
        false;

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   🏆 التشجيع
   ================================================== */

function encouragement() {

  const messages = [

    "أحسنت يا بطل! 🌟",

    "ما شاء الله عليك! 👏",

    "رائع يا بطل! ⭐",

    "ممتاز! بارك الله فيك ❤️"

  ];


  const message =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];


  /*
   * تأخير بسيط حتى لا يتداخل
   * التشجيع مع القراءة السابقة.
   */

  setTimeout(
    function() {

      speakText(
        message
      );

    },
    300
  );

}


/* ==================================================
   🔊 صوت التشجيع
   ================================================== */

function speakText(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  speechVersion++;

  window.speechSynthesis.cancel();


  speakingIndex =
    null;

  speechType =
    "message";


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ar-SA";

  utterance.rate =
    0.85;

  utterance.pitch =
    1.15;

  utterance.volume =
    1;


  utterance.onend =
    function() {

      speechType =
        null;

    };


  utterance.onerror =
    function() {

      speechType =
        null;

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   ⭐ العدّاد
   ================================================== */

function countZekr(
  index,
  button
) {

  if (
    counters[index] ===
    undefined
  ) {

    counters[index] =
      0;

  }


  /*
   * لا نتجاوز العدد المطلوب.
   */

  if (
    counters[index] >=
    azkar[index].count
  ) {

    return;

  }


  counters[index]++;


  button.textContent =
    counters[index] +
    " / " +
    azkar[index].count;


  /*
   * حفظ التقدم فورًا.
   */

  localStorage.setItem(
    "eveningAzkarCounters",
    JSON.stringify(
      counters
    )
  );


  /*
   * عند إكمال الذكر.
   */

  if (
    counters[index] ===
    azkar[index].count
  ) {

    const card =
      button
        .parentElement
        .parentElement;


    card.classList.add(
      "completed"
    );


    /*
     * ⭐ نجمة واحدة فقط
     * لكل ذكر في اليوم.
     */

    const starKey =
      "eveningStar_" +
      today +
      "_" +
      index;


    if (
      localStorage.getItem(
        starKey
      ) !== "1"
    ) {

      stars++;


      localStorage.setItem(
        "childStars",
        stars
      );


      localStorage.setItem(
        starKey,
        "1"
      );


      document.getElementById(
        "stars"
      ).textContent =
        stars;


      encouragement();

    }


    /*
     * التأكد من اكتمال جميع
     * أذكار المساء.
     */

    const completed =
      azkar.every(
        (item, i) =>
          Number(
            counters[i]
          ) ===
          item.count
      );


    if (
      completed
    ) {

      setTimeout(
        function() {

          const finish =
            document.getElementById(
              "finishMessage"
            );


          finish.style.display =
            "block";


          /*
           * لا ننطق رسالة الإكمال
           * أكثر من مرة في نفس فتح الصفحة.
           */

          if (
            !window.eveningFinishedSpoken
          ) {

            window.eveningFinishedSpoken =
              true;


            speakText(
              "أحسنت يا بطل! بارك الله فيك، لقد أكملت أذكار المساء."
            );

          }

        },
        1200
      );

    }

  }

}


/* ==================================================
   ❤️ المفضلة
   ================================================== */

function favoriteZekr(index) {

  let favorites = [];


  try {

    favorites =
      JSON.parse(
        localStorage.getItem(
          "favoriteAzkar"
        )
      ) || [];

  } catch (error) {

    favorites = [];

  }


  if (
    !favorites.includes(
      azkar[index].text
    )
  ) {

    favorites.push(
      azkar[index].text
    );


    localStorage.setItem(
      "favoriteAzkar",
      JSON.stringify(
        favorites
      )
    );


    alert(
      "❤️ تمت إضافة الذكر إلى المفضلة"
    );

  } else {

    alert(
      "❤️ الذكر موجود بالفعل في المفضلة"
    );

  }

}


/* ==================================================
   🏠 العودة للرئيسية
   ================================================== */

function goBack() {

  stopSpeech();

  window.location.href =
    "index.html";

}


/* ==================================================
   🎉 إظهار رسالة الإكمال
   إذا كانت الأذكار مكتملة مسبقًا
   ================================================== */

function checkFinished() {

  const completed =
    azkar.every(
      (item, i) =>
        Number(
          counters[i]
        ) ===
        item.count
    );


  if (
    completed
  ) {

    document.getElementById(
      "finishMessage"
    ).style.display =
      "block";

  }

}


checkFinished();


/* ==================================================
   تنظيف الصوت عند مغادرة الصفحة
   ================================================== */
