<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f75">

  <title>أذكار الطفل المسلم</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: #f5fbf9;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, Tahoma, sans-serif;

      color: #31504d;

      background:
        radial-gradient(
          circle at 15% 8%,
          #fff8d9 0 9%,
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 20%,
          #e5f7ff 0 10%,
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #f9fffd 0%,
          #eefcf8 55%,
          #fffaf0 100%
        );
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      overflow: hidden;
      padding: 0 0 110px;
    }


    /* =========================
       🌈 الرأس
    ========================= */

    .header {
      position: relative;
      overflow: hidden;

      text-align: center;

      padding: 30px 18px 38px;

      background:
        linear-gradient(
          145deg,
          #bff3e7,
          #8eddd1 55%,
          #bfeee7
        );

      border-radius: 0 0 45px 45px;

      box-shadow:
        0 12px 25px rgba(53,130,120,.18),
        inset 0 -3px 8px rgba(255,255,255,.35);
    }

    .header::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      border-radius: 50%;

      background: rgba(255,255,255,.35);

      top: -100px;
      right: -60px;
    }

    .header::after {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 50%;

      background: rgba(255,255,255,.25);

      bottom: -75px;
      left: -40px;
    }


    .sun {
      position: relative;
      z-index: 2;

      width: 82px;
      height: 82px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 50px;

      background:
        linear-gradient(
          145deg,
          #fff9cf,
          #ffd86b
        );

      border-radius: 28px;

      box-shadow:
        0 10px 18px rgba(191,145,35,.22),
        inset 4px 4px 8px rgba(255,255,255,.8),
        inset -5px -5px 9px rgba(208,153,30,.16);
    }


    .title {
      position: relative;
      z-index: 2;

      margin-top: 15px;

      font-size: 30px;
      font-weight: 900;

      color: #24655e;

      text-shadow:
        0 2px 0 white,
        0 4px 8px rgba(50,110,100,.15);
    }

    .title span {
      color: #087f75;
    }


    .subtitle {
      position: relative;
      z-index: 2;

      display: inline-block;

      margin-top: 12px;

      padding: 9px 17px;

      border-radius: 20px;

      background: rgba(255,255,255,.65);

      color: #39716a;

      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 5px 12px rgba(50,120,110,.12),
        inset 0 1px 2px white;
    }


    /* =========================
       👧🧒 الأطفال
    ========================= */

    .characters {
      display: flex;

      justify-content: space-around;

      align-items: center;

      padding: 24px 18px 12px;
    }

    .child {
      text-align: center;

      font-size: 60px;

      filter:
        drop-shadow(
          0 8px 5px rgba(50,100,95,.16)
        );

      animation:
        floatChild 3s ease-in-out infinite;
    }

    .child:nth-child(2) {
      animation-delay: 1s;
    }

    .child-name {
      margin-top: 5px;

      color: #4c7771;

      font-size: 14px;
      font-weight: bold;
    }

    @keyframes floatChild {

      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }


    /* =========================
       ❤️ الرسالة
    ========================= */

    .message {
      margin: 8px 18px 22px;

      padding: 17px;

      text-align: center;

      font-size: 19px;
      font-weight: 900;

      color: #a45c69;

      background:
        linear-gradient(
          145deg,
          #fff1f4,
          #ffe5eb
        );

      border-radius: 25px;

      border: 1px solid #ffd3dc;

      box-shadow:
        0 8px 18px rgba(190,100,120,.12),
        inset 3px 3px 8px rgba(255,255,255,.9),
        inset -3px -3px 7px rgba(210,120,140,.08);
    }


    /* =========================
       🌈 بطاقات الأذكار
    ========================= */

    .cards {
      padding: 8px 15px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }


    .card {
      position: relative;

      overflow: hidden;

      min-height: 160px;

      width: 100%;

      border: 1px solid rgba(255,255,255,.95);

      border-radius: 30px;

      padding: 18px 10px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      color: #355b57;

      font-family: inherit;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 10px 0 rgba(0,0,0,.07),
        0 16px 25px rgba(50,100,95,.13),
        inset 5px 5px 10px rgba(255,255,255,.8),
        inset -6px -7px 12px rgba(70,100,95,.07);

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }


    .card::before {
      content: "";

      position: absolute;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background: rgba(255,255,255,.35);

      top: -45px;
      right: -30px;
    }


    .card::after {
      content: "";

      position: absolute;

      width: 60px;
      height: 60px;

      border-radius: 50%;

      background: rgba(255,255,255,.22);

      bottom: -25px;
      left: -18px;
    }


    .card:active {
      transform:
        translateY(5px)
        scale(.96);

      box-shadow:
        0 4px 0 rgba(0,0,0,.06),
        0 8px 15px rgba(50,100,95,.10),
        inset 4px 4px 8px rgba(255,255,255,.7);
    }


    /* =========================
       🔆 الأيقونات
    ========================= */

    .icon {
      position: relative;

      z-index: 2;

      width: 76px;
      height: 76px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 11px;

      font-size: 45px;

      border-radius: 25px;

      background:
        rgba(255,255,255,.58);

      box-shadow:
        0 8px 12px rgba(50,100,95,.12),
        inset 4px 4px 8px rgba(255,255,255,.95),
        inset -4px -4px 8px rgba(70,100,95,.08);

      filter:
        drop-shadow(
          0 4px 3px rgba(50,90,85,.15)
        );
    }


    .card-title {
      position: relative;
      z-index: 2;

      font-size: 17px;
      letter-spacing: .2px;
    }


    /* =========================
       🎨 ألوان الأقسام
    ========================= */

    .morning {
      background:
        linear-gradient(
          145deg,
          #fff4b8,
          #ffe39a
        );
    }

    .evening {
      background:
        linear-gradient(
          145deg,
          #dce9ff,
          #c6d9ff
        );
    }

    .sleep {
      background:
        linear-gradient(
          145deg,
          #e8ddff,
          #d8c8f7
        );
    }

    .food {
      background:
        linear-gradient(
          145deg,
          #ffe0cf,
          #ffd0ba
        );
    }

    .home {
      background:
        linear-gradient(
          145deg,
          #d4f4e6,
          #bde9d7
        );
    }

    .prayer {
      background:
        linear-gradient(
          145deg,
          #d3f2f4,
          #bce5e8
        );
    }

    .favorite-card {
      background:
        linear-gradient(
          145deg,
          #ffe0e8,
          #ffcdd9
        );
    }

    .reminder {
      background:
        linear-gradient(
          145deg,
          #fff0c9,
          #ffe1a2
        );
    }


    /* =========================
       ⭐ النجوم
    ========================= */

    .stars {
      margin: 22px 15px;

      padding: 18px;

      display: flex;

      align-items: center;

      justify-content: space-around;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          #fff9dc,
          #fff0b8
        );

      border: 1px solid #ffe4a1;

      color: #80652d;

      box-shadow:
        0 10px 20px rgba(180,140,45,.13),
        inset 5px 5px 10px rgba(255,255,255,.9),
        inset -4px -4px 8px rgba(210,170,70,.08);
    }


    .big-star {
      font-size: 46px;

      filter:
        drop-shadow(
          0 7px 4px rgba(180,130,20,.2)
        );
    }


    .stars-text {
      text-align: center;

      font-weight: 900;
    }


    .stars-number {
      margin-top: 4px;

      font-size: 25px;

      color: #d39a19;
    }


    /* =========================
       🏠 القائمة السفلية
    ========================= */

    .bottom-nav {
      position: fixed;

      bottom: 12px;

      left: 12px;
      right: 12px;

      width: auto;
      max-width: 576px;

      margin: auto;

      display: flex;

      justify-content: space-around;

      padding: 9px 5px;

      background:
        rgba(255,255,255,.94);

      border: 1px solid
        rgba(190,220,215,.9);

      border-radius: 27px;

      backdrop-filter: blur(15px);

      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 10px 28px rgba(40,100,95,.18),
        inset 0 1px 2px white;

      z-index: 100;
    }


    .nav-button {
      flex: 1;

      border: none;

      background: transparent;

      color: #51716c;

      font-family: inherit;

      font-size: 11px;

      font-weight: bold;

      cursor: pointer;

      padding: 6px 10px;

      border-radius: 17px;

      transition: .18s;
    }


    .nav-button.active {
      background: #dff7f1;

      color: #087f75;

      box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.9),
        0 4px 8px rgba(50,120,110,.10);
    }


    .nav-button:active {
      transform: scale(.92);
    }


    .nav-icon {
      display: block;

      font-size: 23px;

      margin-bottom: 3px;
    }


    /* =========================
       📱 الهاتف
    ========================= */

    @media (max-width: 400px) {

      .title {
        font-size: 27px;
      }

      .child {
        font-size: 54px;
      }

      .cards {
        gap: 13px;

        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        min-height: 148px;

        border-radius: 26px;
      }

      .icon {
        width: 68px;
        height: 68px;

        font-size: 40px;
      }

      .card-title {
        font-size: 15px;
      }

      .bottom-nav {
        left: 8px;
        right: 8px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       الرأس
  ========================== -->

  <header class="header">

    <div class="sun">☀️</div>

    <div class="title">
      أذكار <span>الطفل المسلم</span>
    </div>

    <div class="subtitle">
      🌿 أذكاري اليومية.. قلب مطمئن 🌿
    </div>

  </header>


  <!-- =========================
       الأطفال
  ========================== -->

  <section class="characters">

    <div class="child">
      👦
      <div class="child-name">
        هيا نذكر الله 🌟
      </div>
    </div>

    <div class="child">
      👧
      <div class="child-name">
        لنبدأ معًا 💚
      </div>
    </div>

  </section>


  <!-- =========================
       الرسالة
  ========================== -->

  <div class="message">
    ❤️ احفظ الله يحفظك ❤️
  </div>


  <!-- =========================
       بطاقات الأقسام
  ========================== -->

  <section class="cards">

    <button
      class="card morning"
      type="button"
      onclick="openPage('morning.html')">

      <span class="icon">☀️</span>
      <span class="card-title">أذكار الصباح</span>

    </button>


    <button
      class="card evening"
      type="button"
      onclick="openPage('evening.html')">

      <span class="icon">🌙</span>
      <span class="card-title">أذكار المساء</span>

    </button>


    <button
      class="card sleep"
      type="button"
      onclick="openPage('sleep.html')">

      <span class="icon">⭐</span>
      <span class="card-title">أذكار النوم</span>

    </button>


    <button
      class="card food"
      type="button"
      onclick="openPage('food.html')">

      <span class="icon">🍎</span>
      <span class="card-title">أذكار الطعام</span>

    </button>


    <button
      class="card home"
      type="button"
      onclick="openPage('home.html')">

      <span class="icon">🏠</span>
      <span class="card-title">أذكار المنزل</span>

    </button>


    <button
      class="card prayer"
      type="button"
      onclick="openPage('prayer.html')">

      <span class="icon">🕌</span>
      <span class="card-title">أذكار الصلاة</span>

    </button>


    <button
      class="card favorite-card"
      type="button"
      onclick="openPage('favorites.html')">

      <span class="icon">❤️</span>
      <span class="card-title">أذكاري المفضلة</span>

    </button>


    <button
      class="card reminder"
      type="button"
      onclick="openPage('reminders.html')">

      <span class="icon">🔔</span>
      <span class="card-title">تذكير الأذكار</span>

    </button>

  </section>


  <!-- =========================
       النجوم
  ========================== -->

  <section class="stars">

    <div class="big-star">
      ⭐
    </div>

    <div class="stars-text">

      <div>
        نجومك اليوم
      </div>

      <div class="stars-number">
        <span id="starCount">0</span>
        ⭐
      </div>

    </div>

    <div>
      🎁
    </div>

  </section>


  <!-- =========================
       القائمة السفلية
  ========================== -->

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      type="button"
      onclick="goHome()">

      <span class="nav-icon">🏠</span>
      الرئيسية

    </button>


    <button
      class="nav-button"
      type="button"
      onclick="openSection('تعلم')">

      <span class="nav-icon">📖</span>
      تعلم

    </button>


    <button
      class="nav-button"
      type="button"
      onclick="openSection('إنجازاتي')">

      <span class="nav-icon">🏆</span>
      إنجازاتي

    </button>


    <button
      class="nav-button"
      type="button"
      onclick="openSection('الإعدادات')">

      <span class="nav-icon">⚙️</span>
      الإعدادات

    </button>

  </nav>

</div>


<script>
  /* =========================
     ⭐ النجوم
  ========================= */

  let stars =
    Number(localStorage.getItem("childStars")) || 0;

  const starCount =
    document.getElementById("starCount");

  if (starCount) {
    starCount.textContent = stars;
  }


  /* =========================
     📂 فتح الأقسام
  ========================= */

  function openPage(page) {
    window.location.href = page;
  }


  /* =========================
     🏠 الرئيسية
  ========================= */

  function goHome() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================
     📖 الأقسام القادمة
  ========================= */

  function openSection(name) {

    alert(
      "🌟 " +
      name +
      "\n\nسنضيف هذه الصفحة في الخطوة القادمة ❤️"
    );

  }
</script>


<!-- =========================
     🔥 Firebase Notifications
========================== -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getMessaging,
    getToken,
    onMessage
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyAVXjifBL3sFF6n4CYy39ur4Al6L7J_KeQ",

    authDomain:
      "muslim-kids-azkar.firebaseapp.com",

    projectId:
      "muslim-kids-azkar",

    storageBucket:
      "muslim-kids-azkar.firebasestorage.app",

    messagingSenderId:
      "204235175360",

    appId:
      "1:204235175360:web:cd6f4aac2d8f9e1d4f0425"

  };


  const app =
    initializeApp(firebaseConfig);

  const messaging =
    getMessaging(app);


  /* =========================
     🔔 تفعيل الإشعارات
  ========================= */

  async function enableNotifications() {

    try {

      if (!("Notification" in window)) {

        alert(
          "عذرًا، متصفحك لا يدعم الإشعارات 🔔"
        );

        return;
      }


      const permission =
        await Notification.requestPermission();


      if (permission !== "granted") {

        alert(
          "لم يتم السماح بالإشعارات 🔔"
        );

        return;
      }


      const registration =
        await navigator.serviceWorker.register(
          "/firebase-messaging-sw.js"
        );


      const token =
        await getToken(messaging, {

          vapidKey:
            "BIJWsZf174Mxmb5nnwUk8-L6g4tRL3kPYMr10jS7YAGYL5-S9ArjUN05x38RIsZSgHkyRw5XHAUw9fjRnZnQ2Hw",

          serviceWorkerRegistration:
            registration

        });


      if (token) {

        console.log(
          "FCM Token:",
          token
        );


        localStorage.setItem(
          "fcmToken",
          token
        );


        alert(
          "✅ تم تفعيل إشعارات أذكار الطفل المسلم 🔔❤️"
        );

      } else {

        alert(
          "لم يتم الحصول على رمز الإشعارات."
        );

      }

    } catch (error) {

      console.error(
        "Notification error:",
        error
      );

      alert(
        "حدث خطأ أثناء تفعيل الإشعارات 🔔"
      );

    }

  }


  /* جعل الدالة متاحة للصفحات الأخرى */

  window.enableNotifications =
    enableNotifications;


  /* =========================
     🔔 استقبال الإشعار عند فتح الموقع
  ========================= */

  onMessage(
    messaging,
    (payload) => {

      console.log(
        "رسالة أثناء فتح الموقع:",
        payload
      );


      if (payload.notification) {

        new Notification(
          payload.notification.title ||
            "أذكار الطفل المسلم",

          {

            body:
              payload.notification.body ||
              "حان وقت الأذكار 🌷"

          }

        );

      }

    }
  );

</script>

</body>
</html>
