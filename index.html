<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#087f75">

  <title>أذكار الطفل المسلم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.15), transparent 25%),
        linear-gradient(145deg, #062e2b, #0b5d58 45%, #092f3b);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      overflow: hidden;
      padding-bottom: 100px;
    }

    /* ===== الرأس ===== */

    .header {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 35px 15px 30px;

      background:
        linear-gradient(145deg, #0b766e, #064b55);

      border-radius: 0 0 45px 45px;

      box-shadow:
        0 12px 30px rgba(0,0,0,.30);
    }

    .header::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      top: -90px;
      right: -50px;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      bottom: -70px;
      left: -40px;
    }

    .sun {
      position: relative;
      z-index: 2;
      font-size: 60px;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.35));
    }

    .title {
      position: relative;
      z-index: 2;
      margin-top: 8px;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 4px 8px rgba(0,0,0,.35);
    }

    .title span {
      color: #9ff5df;
    }

    .subtitle {
      position: relative;
      z-index: 2;
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 25px;

      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(10px);

      font-size: 15px;
      font-weight: bold;

      box-shadow:
        0 8px 18px rgba(0,0,0,.20);
    }

    /* ===== الأطفال ===== */

    .characters {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 25px 15px 15px;
    }

    .child {
      text-align: center;
      font-size: 65px;
      filter: drop-shadow(0 8px 7px rgba(0,0,0,.3));
    }

    .child-name {
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    /* ===== الرسالة ===== */

    .message {
      margin: 8px 20px 22px;
      padding: 18px;

      text-align: center;
      font-size: 20px;
      font-weight: bold;

      background: rgba(255,255,255,.10);

      border: 1px solid rgba(255,255,255,.18);
      border-radius: 25px;

      box-shadow:
        0 12px 25px rgba(0,0,0,.22),
        inset 0 1px 2px rgba(255,255,255,.15);

      backdrop-filter: blur(12px);
    }

    /* ===== بطاقات الأذكار ===== */

    .cards {
      padding: 10px 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      position: relative;
      overflow: hidden;

      border: 1px solid rgba(255,255,255,.18);

      min-height: 145px;

      border-radius: 27px;
      padding: 18px 10px;

      color: white;
      font-weight: bold;
      font-size: 16px;

      cursor: pointer;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.20),
          rgba(255,255,255,.06)
        );

      box-shadow:
        0 14px 25px rgba(0,0,0,.28),
        inset 0 2px 3px rgba(255,255,255,.18);

      transition: .25s ease;
    }

    .card::before {
      content: "";
      position: absolute;

      width: 80px;
      height: 80px;

      border-radius: 50%;

      background: rgba(255,255,255,.07);

      top: -25px;
      right: -20px;
    }

    .card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 22px 35px rgba(0,0,0,.35),
        inset 0 2px 3px rgba(255,255,255,.20);
    }

    .card:active {
      transform: translateY(3px) scale(.97);
    }

    .icon {
      position: relative;
      z-index: 2;

      display: block;

      font-size: 48px;
      margin-bottom: 12px;

      filter:
        drop-shadow(0 7px 6px rgba(0,0,0,.35));
    }

    .card-title {
      position: relative;
      z-index: 2;
    }

    /* ===== النجوم ===== */

    .stars {
      margin: 22px 15px;

      padding: 18px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      border-radius: 25px;

      background: rgba(255,255,255,.10);

      border: 1px solid rgba(255,255,255,.15);

      box-shadow:
        0 12px 25px rgba(0,0,0,.25);

      backdrop-filter: blur(10px);
    }

    .big-star {
      font-size: 45px;
      filter: drop-shadow(0 6px 5px rgba(0,0,0,.3));
    }

    .stars-text {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    .stars-number {
      margin-top: 5px;
      font-size: 25px;
    }

    /* ===== القائمة السفلية ===== */

    .bottom-nav {
      position: fixed;

      bottom: 12px;
      left: 12px;
      right: 12px;

      max-width: 576px;
      margin: auto;

      display: flex;
      justify-content: space-around;

      padding: 9px 5px;

      background: rgba(5,40,38,.90);

      border: 1px solid rgba(255,255,255,.13);

      border-radius: 25px;

      backdrop-filter: blur(15px);

      box-shadow:
        0 12px 30px rgba(0,0,0,.35);

      z-index: 100;
    }

    .nav-button {
      border: none;
      background: transparent;

      color: white;

      font-size: 12px;

      cursor: pointer;

      padding: 5px 10px;

      border-radius: 15px;

      transition: .2s;
    }

    .nav-button.active {
      background: rgba(255,255,255,.12);
    }

    .nav-button:active {
      transform: scale(.92);
    }

    .nav-icon {
      display: block;
      font-size: 23px;
      margin-bottom: 3px;
    }

    /* ===== الهاتف ===== */

    @media (max-width: 400px) {

      .title {
        font-size: 28px;
      }

      .child {
        font-size: 55px;
      }

      .card {
        min-height: 135px;
      }

      .icon {
        font-size: 42px;
      }

      .bottom-nav {
        left: 8px;
        right: 8px;
      }

      .nav-button {
        padding: 5px 7px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- الرأس -->

  <header class="header">

    <div class="sun">☀️</div>

    <div class="title">
      أذكار <span>الطفل المسلم</span>
    </div>

    <div class="subtitle">
      🌿 أذكاري اليومية.. قلب مطمئن 🌿
    </div>

  </header>


  <!-- الأطفال -->

  <section class="characters">

    <div class="child">
      👦
      <div class="child-name">
        هيا نذكر الله 🌟
      </div>
    </div>

    <div class="child">
      👧
      <div class="child-name">
        لنبدأ معًا 💚
      </div>
    </div>

  </section>


  <!-- الرسالة -->

  <div class="message">
    ❤️ احفظ الله يحفظك ❤️
  </div>


  <!-- بطاقات الأذكار -->

  <section class="cards">

    <button class="card morning"
      onclick="openSection('أذكار الصباح')">

      <span class="icon">☀️</span>
      <span class="card-title">أذكار الصباح</span>

    </button>


    <button class="card evening"
      onclick="openSection('أذكار المساء')">

      <span class="icon">🌙</span>
      <span class="card-title">أذكار المساء</span>

    </button>


    <button class="card sleep"
      onclick="openSection('أذكار النوم')">

      <span class="icon">⭐</span>
      <span class="card-title">أذكار النوم</span>

    </button>


    <button class="card food"
      onclick="openSection('أذكار الطعام')">

      <span class="icon">🍎</span>
      <span class="card-title">أذكار الطعام</span>

    </button>


    <button class="card home"
      onclick="openSection('أذكار المنزل')">

      <span class="icon">🏠</span>
      <span class="card-title">أذكار المنزل</span>

    </button>


    <button class="card prayer"
      onclick="openSection('أذكار الصلاة')">

      <span class="icon">🕌</span>
      <span class="card-title">أذكار الصلاة</span>

    </button>


    <button class="card favorite-card"
      onclick="openSection('أذكاري المفضلة')">

      <span class="icon">❤️</span>
      <span class="card-title">أذكاري المفضلة</span>

    </button>


    <button class="card reminder"
      onclick="openSection('تذكير الأذكار')">

      <span class="icon">🔔</span>
      <span class="card-title">تذكير الأذكار</span>

    </button>

  </section>


  <!-- النجوم -->

  <section class="stars">

    <div class="big-star">
      ⭐
    </div>

    <div class="stars-text">

      <div>
        نجومك اليوم
      </div>

      <div class="stars-number">

        <span id="starCount">0</span>
        ⭐

      </div>

    </div>

    <div>
      🎁
    </div>

  </section>


  <!-- القائمة السفلية -->

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      onclick="goHome()">

      <span class="nav-icon">🏠</span>
      الرئيسية

    </button>


    <button
      class="nav-button"
      onclick="openSection('تعلم')">

      <span class="nav-icon">📖</span>
      تعلم

    </button>


    <button
      class="nav-button"
      onclick="openSection('إنجازاتي')">

      <span class="nav-icon">🏆</span>
      إنجازاتي

    </button>


    <button
      class="nav-button"
      onclick="openSection('الإعدادات')">

      <span class="nav-icon">⚙️</span>
      الإعدادات

    </button>

  </nav>

</div>


<script>

  /* النجوم */

  let stars =
    Number(localStorage.getItem("childStars")) || 0;

  document.getElementById("starCount")
    .textContent = stars;


  /* فتح الأقسام مؤقتًا */

  function openSection(name) {

    alert(
      "🌟 " +
      name +
      "\n\nسنضيف هذه الصفحة في الخطوة القادمة ❤️"
    );

  }


  /* الرئيسية */

  function goHome() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

</script>

</body>
</html>
