<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>التذكيرات 🔔</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      color: #333;
      text-align: center;
    }

    header {
      background: #4caf50;
      color: white;
      padding: 22px;
      font-size: 26px;
      font-weight: bold;
      border-radius: 0 0 25px 25px;
    }

    .container {
      padding: 25px 15px;
    }

    .card {
      background: white;
      margin: 18px auto;
      padding: 22px;
      max-width: 400px;
      border-radius: 22px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .icon {
      font-size: 45px;
    }

    h2 {
      margin: 10px 0;
      color: #388e3c;
    }

    input[type="time"] {
      width: 80%;
      padding: 12px;
      margin: 12px 0;
      border: 2px solid #a5d6a7;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
    }

    button {
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .save {
      background: #4caf50;
    }

    .back {
      background: #607d8b;
      margin-top: 10px;
    }

    .notification {
      display: block;
      width: 90%;
      max-width: 350px;
      margin: 20px auto;
      padding: 14px 24px;
      border-radius: 15px;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .test {
      background: #1565c0;
    }

    .enable {
      background: #2e7d32;
    }

    #status {
      margin-top: 20px;
      font-size: 17px;
      color: #388e3c;
      font-weight: bold;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <header>
    🔔 تذكيراتي
  </header>

  <div class="container">

    <!-- أذكار الصباح -->
    <div class="card">

      <div class="icon">🌅</div>

      <h2>أذكار الصباح</h2>

      <input type="time" id="morningTime">

      <br>

      <button
        class="save"
        onclick="saveMorning()">
        💾 حفظ التذكير
      </button>

    </div>


    <!-- أذكار المساء -->
    <div class="card">

      <div class="icon">🌙</div>

      <h2>أذكار المساء</h2>

      <input type="time" id="eveningTime">

      <br>

      <button
        class="save"
        onclick="saveEvening()">
        💾 حفظ التذكير
      </button>

    </div>


    <!-- أذكار النوم -->
    <div class="card">

      <div class="icon">😴</div>

      <h2>أذكار النوم</h2>

      <input type="time" id="sleepTime">

      <br>

      <button
        class="save"
        onclick="saveSleep()">
        💾 حفظ التذكير
      </button>

    </div>


    <div id="status"></div>


    <!-- اختبار إشعار -->
    <button
      class="notification test"
      onclick="testNotification()">
      🔔 اختبار إشعار الآن
    </button>


    <!-- تفعيل الإشعارات -->
    <button
      class="notification enable"
      onclick="enableNotifications()">
      🔔 تفعيل الإشعارات
    </button>


    <!-- العودة -->
    <button
      class="notification back"
      onclick="history.back()">
      ↩️ العودة
    </button>

  </div>


  <!-- وظائف التذكيرات -->
  <script>

    // تحميل الأوقات المحفوظة

    document.getElementById("morningTime").value =
      localStorage.getItem("morningReminder") || "";

    document.getElementById("eveningTime").value =
      localStorage.getItem("eveningReminder") || "";

    document.getElementById("sleepTime").value =
      localStorage.getItem("sleepReminder") || "";


    // حفظ أذكار الصباح

    function saveMorning() {

      const time =
        document.getElementById("morningTime").value;

      if (!time) {

        alert("اختاري وقت أذكار الصباح 🌅");

        return;
      }

      localStorage.setItem(
        "morningReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار الصباح";

    }


    // حفظ أذكار المساء

    function saveEvening() {

      const time =
        document.getElementById("eveningTime").value;

      if (!time) {

        alert("اختاري وقت أذكار المساء 🌙");

        return;
      }

      localStorage.setItem(
        "eveningReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار المساء";

    }


    // حفظ أذكار النوم

    function saveSleep() {

      const time =
        document.getElementById("sleepTime").value;

      if (!time) {

        alert("اختاري وقت أذكار النوم 😴");

        return;
      }

      localStorage.setItem(
        "sleepReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار النوم";

    }

  </script>


  <!-- Firebase Cloud Messaging -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getMessaging,
      getToken,
      onMessage
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";


    // إعداد Firebase

    const firebaseConfig = {

      apiKey:
        "AIzaSyAVXjifBL3sFF6n4CYy39ur4Al6L7J_KeQ",

      authDomain:
        "muslim-kids-azkar.firebaseapp.com",

      projectId:
        "muslim-kids-azkar",

      storageBucket:
        "muslim-kids-azkar.firebasestorage.app",

      messagingSenderId:
        "204235175360",

      appId:
        "1:204235175360:web:cd6f4aac2d8f9e1d4f0425"

    };


    // تشغيل Firebase

    const app =
      initializeApp(firebaseConfig);


    const messaging =
      getMessaging(app);


    console.log(
      "✅ Firebase Messaging يعمل"
    );


    // تفعيل الإشعارات والحصول على FCM Token

    async function enableNotifications() {

      try {

        // التأكد من دعم الإشعارات

        if (!("Notification" in window)) {

          alert(
            "❌ هذا المتصفح لا يدعم الإشعارات"
          );

          return;
        }


        // طلب إذن الإشعارات

        const permission =
          await Notification.requestPermission();


        if (permission !== "granted") {

          alert(
            "❌ لم يتم السماح بالإشعارات"
          );

          return;
        }


        // تسجيل Service Worker

        const registration =
          await navigator.serviceWorker.register(
            "/azkar-little-muslim/firebase-messaging-sw.js"
          );


        // انتظار Service Worker

        await navigator.serviceWorker.ready;


        // الحصول على FCM Token

        const token =
          await getToken(
            messaging,
            {

              vapidKey:
                "BIJWsZf174Mxmb5nnwUk8-L6g4tRL3kPYMr10jS7YAGYL5-S9ArjUN05x38RIsZSgHkyRw5XHAUw9fjRnZnQ2Hw",

              serviceWorkerRegistration:
                registration

            }
          );


        if (!token) {

          alert(
            "❌ لم يتم الحصول على FCM Token"
          );

          return;
        }


        // حفظ التوكن فقط في الجهاز
        // لا يتم عرضه داخل الصفحة

        localStorage.setItem(
          "fcmToken",
          token
        );


        console.log(
          "✅ FCM Token تم حفظه بنجاح"
        );


        alert(
          "✅ تم تفعيل الإشعارات وحفظ التوكن بنجاح 🔔❤️"
        );

      } catch (error) {

        console.error(
          "Notification error:",
          error
        );


        alert(
          "❌ حدث خطأ أثناء تفعيل الإشعارات:\n\n" +
          error.message
        );

      }

    }


    // جعل الدالة متاحة للزر

    window.enableNotifications =
      enableNotifications;


    // اختبار إشعار محلي

    window.testNotification =
      async function () {

        try {

          if (
            Notification.permission !==
            "granted"
          ) {

            alert(
              "❌ يجب أولًا تفعيل الإشعارات"
            );

            return;
          }


          const registration =
            await navigator.serviceWorker.ready;


          await registration.showNotification(

            "أذكار الطفل المسلم 🌷",

            {

              body:
                "🔔 هذا إشعار تجريبي، الإشعارات تعمل بنجاح ❤️",

              icon:
                "/azkar-little-muslim/icon-192.png",

              badge:
                "/azkar-little-muslim/icon-192.png"

            }

          );

        } catch (error) {

          console.error(
            "Test notification error:",
            error
          );


          alert(
            "❌ لم يتم إرسال الإشعار:\n\n" +
            error.message
          );

        }

      };


    // استقبال رسائل Firebase
    // عندما تكون الصفحة مفتوحة

    onMessage(
      messaging,
      (payload) => {

        console.log(
          "🔔 وصلت رسالة Firebase:",
          payload
        );

      }
    );

  </script>

</body>
</html>
