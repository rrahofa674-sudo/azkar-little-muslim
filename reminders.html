<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>التذكيرات 🔔</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      color: #333;
      text-align: center;
    }

    header {
      background: #4caf50;
      color: white;
      padding: 22px;
      font-size: 26px;
      font-weight: bold;
      border-radius: 0 0 25px 25px;
    }

    .container {
      padding: 25px 15px;
    }

    .card {
      background: white;
      margin: 18px auto;
      padding: 22px;
      max-width: 400px;
      border-radius: 22px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .icon {
      font-size: 45px;
    }

    h2 {
      margin: 10px 0;
      color: #388e3c;
    }

    input[type="time"] {
      width: 80%;
      padding: 12px;
      margin: 12px 0;
      border: 2px solid #a5d6a7;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
    }

    button {
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      background: #4caf50;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .back {
      background: #607d8b;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      font-size: 17px;
      color: #388e3c;
      font-weight: bold;
    }

    #fcmTokenBox {
      display: none;
      width: 90%;
      max-width: 600px;
      height: 180px;
      margin: 20px auto;
      padding: 12px;
      box-sizing: border-box;
      border: 2px solid #4caf50;
      border-radius: 15px;
      background: white;
      color: black;
      font-size: 13px;
      direction: ltr;
      text-align: left;
    }

    #tokenStatus {
      display: none;
      margin: 10px;
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    🔔 تذكيراتي
  </header>

  <div class="container">

    <!-- أذكار الصباح -->
    <div class="card">
      <div class="icon">🌅</div>

      <h2>أذكار الصباح</h2>

      <input type="time" id="morningTime">

      <br>

      <button onclick="saveMorning()">
        💾 حفظ التذكير
      </button>
    </div>


    <!-- أذكار المساء -->
    <div class="card">
      <div class="icon">🌙</div>

      <h2>أذكار المساء</h2>

      <input type="time" id="eveningTime">

      <br>

      <button onclick="saveEvening()">
        💾 حفظ التذكير
      </button>
    </div>


    <!-- أذكار النوم -->
    <div class="card">
      <div class="icon">😴</div>

      <h2>أذكار النوم</h2>

      <input type="time" id="sleepTime">

      <br>

      <button onclick="saveSleep()">
        💾 حفظ التذكير
      </button>
    </div>


    <div id="status"></div>


    <!-- حالة التوكن -->
    <p id="tokenStatus">
      ✅ FCM Token محفوظ على هذا الجهاز
    </p>


    <!-- مربع التوكن -->
    <textarea
      id="fcmTokenBox"
      readonly
      placeholder="سيظهر FCM Token هنا بعد تفعيل الإشعارات">
    </textarea>


    <!-- العودة -->
    <button class="back" onclick="history.back()">
      ↩️ العودة
    </button>

  </div>


  <!-- وظائف الأوقات -->
  <script>

    // تحميل الأوقات المحفوظة

    document.getElementById("morningTime").value =
      localStorage.getItem("morningReminder") || "";

    document.getElementById("eveningTime").value =
      localStorage.getItem("eveningReminder") || "";

    document.getElementById("sleepTime").value =
      localStorage.getItem("sleepReminder") || "";


    // حفظ أذكار الصباح
    function saveMorning() {

      const time =
        document.getElementById("morningTime").value;

      if (!time) {

        alert("اختاري وقت أذكار الصباح 🌅");

        return;
      }

      localStorage.setItem(
        "morningReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار الصباح";

    }


    // حفظ أذكار المساء
    function saveEvening() {

      const time =
        document.getElementById("eveningTime").value;

      if (!time) {

        alert("اختاري وقت أذكار المساء 🌙");

        return;
      }

      localStorage.setItem(
        "eveningReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار المساء";

    }


    // حفظ أذكار النوم
    function saveSleep() {

      const time =
        document.getElementById("sleepTime").value;

      if (!time) {

        alert("اختاري وقت أذكار النوم 😴");

        return;
      }

      localStorage.setItem(
        "sleepReminder",
        time
      );

      document.getElementById("status").innerText =
        "✅ تم حفظ تذكير أذكار النوم";

    }

  </script>

</body>
</html>
